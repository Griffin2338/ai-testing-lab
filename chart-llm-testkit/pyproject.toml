[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chart-llm-testkit"
version = "0.1.0"
description = "Test suite for apps that turn a table and a natural-language request into a chart with an LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "pyyaml>=6.0",
    "pytest>=7.4",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
seaborn = ["seaborn>=0.13"]
dev = ["ruff>=0.5", "hypothesis>=6.90", "seaborn>=0.13"]

[project.scripts]
chart-testkit = "chart_testkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["chart_testkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B023"]
