name: chart-llm-testkit

on:
  push:
    paths: ["chart-llm-testkit/**", ".github/workflows/chart-llm-testkit.yml"]
  pull_request:
    paths: ["chart-llm-testkit/**", ".github/workflows/chart-llm-testkit.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: chart-llm-testkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check chart_testkit tests examples
      - run: pytest -q

  demo:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: chart-llm-testkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[seaborn]"
      - name: Careful fake LLM (must pass)
        run: chart-testkit run examples/fake-careful.yaml --out reports/careful
      # buggy profile has planted bugs; failures are expected
      - name: Buggy fake LLM
        run: chart-testkit run examples/fake.yaml --out reports/buggy --junit reports/buggy/junit.xml
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-llm-testkit-reports
          path: chart-llm-testkit/reports
