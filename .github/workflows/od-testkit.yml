name: od-testkit

on:
  workflow_dispatch:
  push:
    paths: ["od-testkit/**", ".github/workflows/od-testkit.yml"]
  pull_request:
    paths: ["od-testkit/**", ".github/workflows/od-testkit.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: od-testkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check od_testkit tests examples
      - name: Unit and end-to-end tests of the kit
        run: pytest -q

  synthetic-demo:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: od-testkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: od-testkit synth examples/synthetic/data
      # demo detector has planted bugs; failures are expected
      - name: Acceptance suite on the synthetic demo
        run: od-testkit run examples/synthetic/config.yaml --out reports/synthetic --junit reports/synthetic/junit.xml
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: od-testkit-synthetic-report
          path: od-testkit/reports/synthetic
